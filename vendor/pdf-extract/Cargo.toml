[package]
edition = "2018"
name = "pdf-extract"
version = "0.12.0"
authors = ["Jeff Muizelaar <jmuizelaar@mozilla.com>"]
build = false
include = [
    "src/**/*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library to extract content from pdfs"
documentation = "https://docs.rs/crate/pdf-extract/"
readme = "README.md"
keywords = [
    "pdf2text",
    "text",
    "pdf",
    "pdf2txt",
]
license = "MIT"
repository = "https://github.com/jrmuizel/pdf-extract"

[lib]
name = "pdf_extract"
path = "src/lib.rs"

# EVERLASTING PATCH:上游预存 lint 压制(见文件头注释)。
