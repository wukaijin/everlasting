name: CI

# E1 CI 自动化管线 — 防回归 (cargo test + fmt + vitest + vue-tsc)
# design/task: .trellis/tasks/07-05-ci-test-automation/

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.trellis/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.trellis/**'
  workflow_dispatch:

# 同一分支重复 push 取消旧的 in-flight run,省 GH Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (cargo test --lib + --test e2e + fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      # de-Tauri (2026-09-30, task 09-30-de-tauri): the Tauri system
      # deps step (webkit2gtk/gtk/appindicator 全家桶) is GONE — the
      # crate has zero system-lib deps now (reqwest uses rustls, so
      # no libssl-dev either). This job doubles as AC1: a bare
      # ubuntu-latest container with NO pkg-config'd GTK/WebKit must
      # build + test everything below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rust-cache 兜住 vendored-libgit2 的 C 编译产物 (~60s/次)
      # 2026-08-11 workspace 翻转(task 08-11-remote-daemon-core)后
      # Cargo.lock 与产物 target/ 都在 workspace 根 —— 缓存键必须跟着
      # 移到根,否则每次 CI 全量编译(P3-3 修订)。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: cargo fmt --check
        run: cargo fmt --check

      # bin 编译门(de-Tauri 2026-09-30 修订):这是全 CI 唯一构建
      # `bin/everlasting-daemon.rs` 的步骤(`--lib` / `--test e2e` /
      # clippy 面不编译 bin target)。历史上它服务 tauri sidecar
      # staging(externalBin 校验),staging 已随 GUI 删除;职责保留——
      # daemon bin 的编译回归必须在 CI 暴露。
      - name: cargo build daemon bin (bin-target compile gate)
        run: cargo build --bin everlasting-daemon

      # clippy gate (RULE-CI-001, 08-26-p2-debt-cleanup):`--lib --bins`
      # 覆盖 lib + daemon bin(--tests 面的既有基线警告不在 -D 门内,
      # 与历史口径一致)。chat_loop 家族重灾区已由
      # 08-27-rule-args-001-param-object 清零闭合,债务台账见
      # .trellis/reviews/DEBT.md(RULE-ARGS-001)。
      - name: cargo clippy --lib --bins
        run: cargo clippy --lib --bins -- -D warnings

      # N9 bench 编译门(09-19-n9-perf-benchmark):bench 数字不进门禁
      # (抖动),但 bench 代码的编译面必须进——无人跑的 bench 会悄悄腐烂
      # 到编译不过。check 级(criterion 不执行),spec perf-baseline.md §1。
      - name: cargo check benches (bench feature compile gate)
        run: cargo check --lib --features bench --benches

      - name: cargo test --lib
        # N6 (09-26): 沙盒能力类测试在 runner 上必须真跑 —— probe 失败
        # 直接 fail(panic 带三维 capability 明细,runner 镜像变更可归因),
        # 不再静默 SKIP 吞掉覆盖率。本地 dev 不设此 env 照旧 SKIP。
        run: cargo test --lib
        env:
          EVERLASTING_SANDBOX_TESTS_REQUIRED: "1"

      # e2e 进回归基线(RULE-TEST-003, 08-30-e2e-red-fix):tests/e2e.rs 是
      # 进程内 axum router + httpmock 临时端口,无真 daemon/无端口冲突,复用
      # --lib 的编译与 sidecar 前置即可跑。此前 e2e 从未进 CI,坏在干净 HEAD
      # 上也无人知(B1 加必填 supports_images 后 fixture 422 烂了近两周)。
      - name: cargo test --test e2e
        run: cargo test --test e2e

      # ACP shim gate (N20, 09-30-n20-acp-shim-mvp):crates/everlasting-acp
      # 零系统库依赖(纯 rustls/纯内存测试),无需 PKG_CONFIG_PATH 与 sidecar
      # 前置。不在 default-members,必须显式 -p;`-p` 从 workspace 任一成员
      # 目录都可解析(working-directory: app/src-tauri 即可)。clippy 同 gate
      # 口径(-D warnings,--tests 含集成测试);fmt 已是上面 workspace 级。
      - name: cargo clippy everlasting-acp
        run: cargo clippy -p everlasting-acp --tests -- -D warnings
      - name: cargo test everlasting-acp
        run: cargo test -p everlasting-acp

  frontend:
    name: Frontend (vitest + vue-tsc + playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # 版本唯一来源是 app/package.json 的 packageManager 字段。
      # 注意 action-setup 只读**仓库根** package.json(本仓库没有,
      # working-directory 默认值对 action 不生效),所以必须先从
      # app/package.json 提取版本喂给 version 输入,不能省略。
      - name: Resolve pnpm version from app/package.json
        id: pnpm-version
        run: echo "version=$(jq -r '.packageManager | split("@")[-1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'app/pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # 浏览器交互回归(RULE-TEST-001, .trellis/tasks/08-30-rule-test-001-browser-pipeline):
      # route-mock 驱动、无 daemon/无 LLM/无网络依赖,确定性用例才准入(D2)。
      #
      # 缓存 ~/.cache/ms-playwright:chromium 下载 ~120MB 是本 job 最大的
      # 冷启动开销;key 带 OS + @playwright/test 版本(jq 提取,pnpm 版本
      # 同款先例)—— 升级 playwright(→ 浏览器 build 变)时自然 miss 重装,
      # restore-keys 兜底命中旧目录省部分下载;锁文件其它 bump 不误伤。
      # 缓存 miss 时由下一步的 install 补齐,命中则近乎零开销。
      - name: Resolve @playwright/test version
        id: pw-version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # --with-deps:apt 装 headless Chromium 的系统库(libnss3 等),
      # 只在缓存 miss 时真正耗时;命中时 apt 侧幂等快返。
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # N4 虚拟化 e2e(virtualized-list.spec.ts)复用 bench/fixtures 的
      # 10k 种子(readFixture)。种子是 gitignore 生成物(N9 起不入库),
      # CI 必须先再生:gen-fixtures.mjs 读已入库的 profile.json,种子化
      # LCG 确定性输出,秒级完成。
      - name: Generate bench fixtures (10k e2e seed)
        run: pnpm bench:fe:gen

      # blocking merge gate(retries: CI 1 次,playwright.config.ts;
      # webServer 自起 vite dev :1422,无 continue-on-error)。
      - name: Playwright browser regression
        run: pnpm test:e2e

      # N9 前端 bench 编译门(09-19-n9-perf-benchmark):单文件 tsc 检查
      # bench/*.bench.ts 可解析(Node IO 隔离在 io.mjs,app 不装
      # @types/node——实测它经 vitest/globals 污染 vue-tsc 面);bench
      # 数字不进门禁。tsc 编译面不读种子 fixtures(生成物不入库)。
      - name: Bench files compile gate (tsc)
        run: pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --skipLibCheck bench/render.bench.ts
