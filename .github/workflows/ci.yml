name: CI

# E1 CI 自动化管线 — 防回归 (cargo test + fmt + vitest + vue-tsc)
# design/task: .trellis/tasks/07-05-ci-test-automation/

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.trellis/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.trellis/**'
  workflow_dispatch:

# 同一分支重复 push 取消旧的 in-flight run,省 GH Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (cargo test --lib + fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 在 Linux 上 build.rs 编译期就要 pkg-config 找到 webkit/gtk,
      # 即使只跑 `cargo test --lib` 也必须装。reqwest 用 rustls 故省 libssl-dev。
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rust-cache 兜住 vendored-libgit2 的 C 编译产物 (~60s/次)
      # 2026-08-11 workspace 翻转(task 08-11-remote-daemon-core)后
      # Cargo.lock 与产物 target/ 都在 workspace 根 —— 缓存键必须跟着
      # 移到根,否则每次 CI 全量编译(P3-3 修订)。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: cargo fmt --check
        run: cargo fmt --check

      # 必须先 build daemon sidecar,再跑 cargo test --lib。
      #
      # tauri.conf.json 的 bundle.externalBin = ["binaries/everlasting-daemon"]
      # 让 Tauri 在 build.rs 阶段(而非仅 bundle 阶段)就校验
      # binaries/everlasting-daemon-<triple> 存在 —— 校验不过连编译都起不来,
      # 也就跑不了测试。而该文件是构建产物,被 app/src-tauri/.gitignore 忽略,
      # CI checkout 出来 binaries/ 是空的。
      #
      # build.rs::stage_daemon_sidecar() 只在 target/<profile>/everlasting-daemon
      # 已存在时才把它拷到 binaries/。所以必须先 build 一次 daemon bin,
      # build.rs 会顺带把它 stage 进去;之后 cargo test --lib 触发 everlasting
      # crate 的 build.rs 时就能通过 externalBin 校验。(本地之所以不挂,是
      # 因为工作树里那个被 gitignore 的 388MB 产物一直存在。)
      #
      # 代价:CI 首次多 ~2min 编译 daemon;rust-cache 命中后增量很快。
      - name: cargo build daemon sidecar (stages binaries/ for externalBin)
        run: cargo build --bin everlasting-daemon

      - name: cargo test --lib
        run: cargo test --lib

  frontend:
    name: Frontend (vitest + vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # 版本唯一来源是 app/package.json 的 packageManager 字段。
      # 注意 action-setup 只读**仓库根** package.json(本仓库没有,
      # working-directory 默认值对 action 不生效),所以必须先从
      # app/package.json 提取版本喂给 version 输入,不能省略。
      - name: Resolve pnpm version from app/package.json
        id: pnpm-version
        run: echo "version=$(jq -r '.packageManager | split("@")[-1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'app/pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
