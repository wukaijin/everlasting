[package]
name = "everlasting"
version = "0.1.0"
description = "Everlasting - Vibe Coding Workbench"
authors = ["Carlos"]
edition = "2021"
# Phase 2.2 引入 `everlasting-daemon` 后 crate 有两个 binary(GUI
# `everlasting` + daemon `everlasting-daemon`)。Tauri `dev`/`build`
# 底层跑 `cargo run`(不带 `--bin`),无 default-run 时会报
# "could not determine which binary to run"。这里固定默认跑 GUI。
default-run = "everlasting"

[lib]
name = "everlasting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Phase 2.2 (2026-07-21, task `07-20-remote-access-daemon-split`):
# independent daemon bin that runs the agent core outside the Tauri
# GUI process. Shares the same `everlasting_lib` so the agent loop /
# db / tools / state are single-sourced; only the entry point differs
# (`#[tokio::main]` here vs Tauri's `Builder::setup` in `lib.rs`).
[[bin]]
name = "everlasting-daemon"
path = "src/bin/everlasting-daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `serde_json` for build.rs to read `identifier` out of `tauri.conf.json`
# and emit it as `EVERLASTING_APP_IDENTIFIER` (P2.2 path-consistency fix —
# see build.rs::emit_app_identifier). Runtime dep `serde_json` (below)
# does NOT cover build scripts; build-deps are a separate dependency tree.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# P2.4 D1/D2 (2026-07-22, task `07-20-remote-access-daemon-split`): the
# GUI spawns the `everlasting-daemon` sidecar via the shell plugin's
# `Command::new_sidecar` API and `.kill()`s it on `RunEvent::Exit`. The
# matching frontend `@tauri-apps/plugin-shell` is NOT a runtime dep —
# the sidecar is launched from Rust (`app.shell().sidecar(...)`), not
# from JS `invoke`. Capability `shell:allow-execute` is scoped in
# `capabilities/default.json`.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LLM client
# gzip/brotli/deflate: auto-decompress response bodies. Without these
# (plus the matching `.gzip(true)` etc. on the ClientBuilder) we send
# `Accept-Encoding: gzip, br, deflate` but never decode the result —
# the raw compressed bytes then fail `from_utf8` ("non-utf8 html body
# ... invalid utf-8 sequence ... from index 1" = the gzip magic 1f 8b).
reqwest = { version = "0.13", features = ["stream", "json", "rustls", "gzip", "brotli", "deflate"], default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "process", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-stream = "0.3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Persistence (step 3a)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-os = "2.3.2"

# Tooling (toolset extension: edit_file / grep / glob / list_dir)
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Step 4: Git worktree isolation
# `vendored-libgit2` pulls a C libgit2 build into the binary, so the
# runtime doesn't depend on a system-installed `libgit2`. First build
# pays ~30-90s compiling the C source; subsequent builds use cargo's
# incremental cache and sccache if configured.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

# B5 Memory (V2 first-tier, 2026-06-10; mtime fence 2026-06-15):
# - `tiktoken-rs` for cl100k_base token estimation (4 files * <2K each
#   in 200K context — estimation is good enough; not exact per-model).
# - `dirs` 5.x to resolve `~/.config/everlasting/` cross-platform.
# (notify was removed: freshness is now an mtime fence in
# load_for_session, not a background watcher.)
tiktoken-rs = "0.6"
dirs = "5"

# P1 web_fetch (2026-06-12):
# - `htmd` 0.5 for HTML→Markdown conversion. Leanest deps of the
#   surveyed crates (~3 direct, ~33 transitive), Apache-2.0, passes
#   the full turndown.js test corpus. See
#   `.trellis/tasks/06-12-feat-tools-web-fetch-agent-api-p1/research/html-to-markdown-rust.md`.
htmd = "0.5"

# A5+ LLM retry backoff (2026-07-04):
# - `fastrand` 2.x for Full Jitter RNG. Near-zero deps, no std required.
#   `fastrand::Rng` lets tests inject a fixed seed for deterministic backoff
#   (pure exponential would make retry tests flaky).
fastrand = "2"

# A2 + B7 (Permission system + per-session Mode, 2026-06-13):
# - `libc` for the `geteuid()` root check (Unix) + `#[cfg]` branch
#   for Windows. Avoids pulling the full `nix` crate for one call.
# - `regex` 1.x for the Tier 2 hard kill list patterns in
#   `agent/permissions/dangerous.rs`. Compile-time regex is not
#   needed (the patterns are runtime constants); std + this
#   dep is plenty.
libc = "0.2"
regex = "1"

# RULE-D-001 (P1 API key 加密, 2026-06-24): AES-256-GCM + HKDF(machine-id).
# 见 .trellis/tasks/06-24-p1-api-key-encryption/research/app-layer-encryption-rust.md
# - aes-gcm 0.10: RustCrypto AEAD, aead/rand_core trait re-export, OsRng 走
#   getrandom(WSL 原生可用). 不单列 aead/rand_core/getrandom(由 aes-gcm re-export).
# - hkdf 0.12 + sha2 0.10: 从 machine-id 派生 32B master key (Hkdf<Sha256>).
# - machine-uid 0.6: 跨平台取 /etc/machine-id / IOPlatformUUID / MachineGuid.
# - base64 0.22: blob(VERSION||nonce||ct||tag) ↔ SQLite TEXT 编码.
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
machine-uid = "0.6"
base64 = "0.22"

# Phase 2.2 (2026-07-21, task `07-20-remote-access-daemon-split`):
# HTTP daemon stack — exposes the 79 `#[tauri::command]`-equivalent
# handlers via axum so a browser (or the Tauri GUI over httpTransport
# in P2.4) can drive the agent core without Tauri IPC.
# - `axum 0.7` is the Tower-on-Hyper HTTP framework; `macros` feature
#   unlocks `#[debug_handler]` (unused in production but handy for
#   type-erased handler debug in dev).
# - `tower 0.5` + `tower-http 0.6` provide Service middleware
#   (P2.4 ServeDir; P2.3 SSE helpers reuse `tower-http::services`)
#   + `cors` feature → `CorsLayer`(P2.3 C6 收尾,dev 跨域 vite 1420 ↔
#   daemon 7456;P2.4 sidecar 同源后移除)。
# - `tokio-stream 0.1` with `sync` feature → `tokio_stream::wrappers::BroadcastStream`
#   + `wrappers::UnboundedReceiverStream` for SSE channel adapters (P2.3).
# - `clap 4` for the daemon bin's `--port` flag. Default features
#   disabled to keep compile time down — we only need `derive` +
#   `cargo` (for `env!` version interpolation). The daemon bin is
#   the only consumer; the lib doesn't depend on clap.
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# Mock HTTP server for `web_fetch` integration tests. Spin up a
# localhost mock at runtime; assert on the request the tool sent
# (URL, headers, redirect chain, etc.) and serve canned responses.
httpmock = "0.7"
# Pure-Rust gzip encoder for the `web_fetch` "server returns gzip"
# integration test (reqwest auto-decompresses; we have to *produce*
# a valid gzip body on the mock side to exercise that path). Uses
# the miniz_oxide backend — no C dependency.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
