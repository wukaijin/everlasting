[workspace]
# 2026-08-11 (task 08-11-remote-daemon-core): flipped to a Cargo workspace
# to host the new `everlasting-remote` crate (independent of the daemon's
# heavy deps like libgit2/Tauri/agent core). The original single-crate
# `everlasting` (app/src-tauri) stays a member unchanged — its build.rs,
# `EVERLASTING_APP_IDENTIFIER` injection, and Tauri sidecar staging all
# keep working because CARGO_MANIFEST_DIR is still app/src-tauri.
members = [
    "app/src-tauri",
    "crates/everlasting-remote",
    "crates/everlasting-remote-protocol",
]
resolver = "2"

# Avoid pulling Tauri's heavy compile graph when someone runs a bare
# `cargo build` at the repo root. The daemon + GUI must be built
# explicitly: from the repo root `cargo build -p everlasting [--bin
# everlasting-daemon]`, or from inside `app/src-tauri/` (where daemon.sh
# and CI run) plain `cargo build --bin everlasting-daemon` — the member
# directory makes that package the current one, so `--bin` resolves
# without `-p`. Note: `--bin` WITHOUT `-p` at the repo root only looks
# in the default members, so it cannot see the daemon.
# 日常迭代 daemon 用 `--profile daemon`(见下方 [profile.daemon],
# 2026-08-29:无 LTO + 增量,改后端代码 ~1-2min 出二进制);
# `--release`(fat LTO + CGU=1)留给发布 / sidecar。
default-members = [
    "crates/everlasting-remote",
    "crates/everlasting-remote-protocol",
]

# Vendored pdf-extract 0.12.0(2026-08-26, task 08-26-f5-verify-followups
# 问题 1):上游对 /Encoding Name 形式的 UniGB-UCS2-H 等非嵌入 CJK 编码
# panic,且未知编码家族/畸形 ToUnicode 全是 panic/todo! 路径。exclude 使
# vendored 副本保持独立 package(path 依赖仍生效),不进 workspace 成员;
# patch 内容见 vendor/pdf-extract/Cargo.toml 头注释。
exclude = ["vendor/pdf-extract"]

# Profile settings lifted from app/src-tauri/Cargo.toml when the workspace
# was flipped (2026-08-11). Profiles MUST live at the workspace root; member
# `[profile.*]` is silently ignored by cargo.
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 2026-08-26: 删除 panic = "abort" 回到默认 unwind。abort 模式下任何第三方
# 库的 panic(实证:pdf-extract 对 UniGB-UCS2-H)直接击穿 daemon 整进程,
# doc_extract.rs 的 catch_unwind 兜底是死代码 —— 与「turn 不死」硬约束
# 结构性冲突。不得回设 abort,除非先把文档提取挪进独立子进程。
strip = true

# 2026-08-29(daemon 增量编译提速):daemon.sh 日常迭代专档。此前迭代也走
# release(fat LTO + CGU=1),--timings 实测改动一行 ≈ 6-7min:leaf crate
# 全量重编 247s(fat LTO 与增量编译互斥)+ LTO/链接 124s,依赖全缓存 ——
# 时间全花在自家 crate + 链接上。本档继承 release 的 opt-level="s"/strip
# (运行性能与发布档基本一致;daemon 是 I/O 密集,LLM/网络/SQLite 等待
# 占主导,不感知 LTO),只放开迭代致命的三项:LTO、codegen-units、增量。
# 首次构建会为该档全量编一遍依赖(一次性 ~10-20min);产物在
# target/daemon/。发布 / sidecar 打包仍走 --release。
[profile.daemon]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

