<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Everlasting 动效方案八:数字信号">
  <title>Everlasting — 数字信号(Signal Decode)</title>
  <desc>终端/信号解码风:双环以不等长摩斯划(短线-长线,butt 端帽)呈现,图案沿环缓慢滑动,
    如同数据流;一道亮色解码光标高速巡检;底层全弧作离散式亮度跳变(数字噪声);
    spark 化为终端光标按 1.1s 节拍明灭,下方的光标条同步闪烁;外围两圈反向缓旋的载波虚线环。
    纯 SMIL,无 JS/CSS。摩斯 dasharray 总和恰为 100(与 pathLength 对齐,滑动无缝)。</desc>
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1c2a42"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
    <filter id="glowDot" x="-350%" y="-350%" width="800%" height="800%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 2026-08-28 v2 品牌同步:主环/拖尾用顶部受光渐变,spark 加辉光(与 brand/logo-mark.svg v2 一致) -->
  <linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#67e8f9"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#fcd34d"/><stop offset="0.55" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
  <radialGradient id="gl">
    <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.8"/><stop offset="0.45" stop-color="#a5f3fc" stop-opacity="0.3"/><stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
  </radialGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="71" fill="none" stroke="#2a3850" stroke-width="3" opacity="0.45"/>

  <!-- 载波虚线环(反向缓旋) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#22d3ee" stroke-width="1.5"
          stroke-dasharray="1 4" opacity="0.14">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256"
                      dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#fbbf24" stroke-width="1.5"
          stroke-dasharray="1 7" opacity="0.09">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="-360 256 256"
                      dur="34s" repeatCount="indefinite"/>
  </circle>

  <!-- 轮廓底稿 -->
  <g fill="none" stroke-width="30" stroke-linecap="butt" opacity="0.1">
    <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)"/>
    <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)"/>
  </g>

  <!-- 数字噪声层(全弧,离散亮度跳变) -->
  <g fill="none" stroke-width="30" stroke-linecap="butt">
    <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)" opacity="0.1">
      <animate attributeName="opacity" values="0.08;0.18;0.1;0.16;0.08" keyTimes="0;0.18;0.4;0.62;1"
               calcMode="discrete" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)" opacity="0.1">
      <animate attributeName="opacity" values="0.16;0.08;0.14;0.09;0.16" keyTimes="0;0.25;0.5;0.75;1"
               calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 摩斯数据流(图案沿环滑动,双向) -->
  <g fill="none" stroke-width="30" stroke-linecap="butt" opacity="0.92">
    <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36"
          stroke="url(#gc)" stroke-dasharray="14 4 3 4 9 4 22 4 5 4 20 7" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="9s" repeatCount="indefinite"/>
    </path>
    <path pathLength="100" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36"
          stroke="url(#ga)" stroke-dasharray="6 4 18 4 4 4 24 5 11 4 12 4" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
  <path id="motA" d="M 231.12 296.36 A 118 118 0 1 0 231.12 215.64" fill="none" stroke="none"/>

  <!-- 解码光标(亮段 + 亮头,高速巡检) -->
  <g fill="none" stroke-width="30" stroke-linecap="round">
    <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36"
          stroke="#9ff3ff" stroke-dasharray="6 94" stroke-dashoffset="6">
      <animate attributeName="stroke-dashoffset" values="6;-94" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path pathLength="100" d="M 231.12 296.36 A 118 118 0 1 0 231.12 215.64"
          stroke="#ffe3a3" stroke-dasharray="6 94" stroke-dashoffset="6">
      <animate attributeName="stroke-dashoffset" values="6;-94" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g filter="url(#glowDot)">
    <circle r="7" fill="#dffbff">
      <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#loopC"/></animateMotion>
    </circle>
    <circle r="7" fill="#fff0d0">
      <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#motA"/></animateMotion>
    </circle>
  </g>
  <path id="loopC" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" fill="none" stroke="none"/>
  <path id="loopA" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" fill="none" stroke="none"/>

  <!-- spark:终端光标(离散明灭)+ 光标条 -->
  <circle cx="256" cy="256" r="36" fill="url(#gl)" opacity="1">
    <animate attributeName="opacity" values="0.8;0.08" keyTimes="0;0.55" calcMode="discrete"
             dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="13" fill="#f8fafc" filter="url(#glowDot)">
    <animate attributeName="opacity" values="1;0.12" keyTimes="0;0.55" calcMode="discrete"
             dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <rect x="243" y="280" width="26" height="3" rx="1.5" fill="#f8fafc" opacity="1">
    <animate attributeName="opacity" values="0.85;0.1" keyTimes="0;0.55" calcMode="discrete"
             dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
