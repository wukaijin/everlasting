<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Everlasting 动效方案十二:分段组装">
  <title>Everlasting — 分段组装(Assemble)</title>
  <desc>几何组装循环,6s 一回合,全部动画共用 6s 时钟(纯 keyTimes 编排,无缝循环):
    [0–41%] 六段弧片段(每环三段,错相进场)自四散位置平移归位——缓出曲线落座,
      全程有 10% 透明度的蓝图底稿指示目标位置;
    [44%–56%] 焊接:一道白光沿双环匀速扫过接缝,spark 弹出并落定;
    [56%–60%] 完整体静置;
    [60%–77%] 解体:片段沿原路退回四散位置并淡出(来去同路,读作"拆解回收");
    [77%–100%] 只剩蓝图底稿,等待下一轮。
    与 evolve(星尘聚合)的区别:evolve 是粒子结晶,assemble 是刚性分段装配,
    语义 = "会话由多段协作拼接而成"。
    片段实现:完整环 path + pathLength=100 + dasharray "33.33 66.67" + dashoffset -起点,
    每段一个元素便于独立 transform。</desc>
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1c2a42"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
    <filter id="glowTrack" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-350%" y="-350%" width="800%" height="800%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <!-- 2026-08-28 v2 品牌同步:主环/拖尾用顶部受光渐变,spark 加辉光(与 brand/logo-mark.svg v2 一致) -->
  <linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#67e8f9"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#fcd34d"/><stop offset="0.55" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
  <radialGradient id="gl">
    <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.8"/><stop offset="0.45" stop-color="#a5f3fc" stop-opacity="0.3"/><stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <mask id="onCyan" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  </mask>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="71" fill="none" stroke="#2a3850" stroke-width="3" opacity="0.45"/>

  <!-- 蓝图底稿(全程指示目标位置) -->
  <g fill="none" stroke-width="30" stroke-linecap="round" opacity="0.1">
    <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="#22d3ee"/>
    <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="#fbbf24"/>
  </g>

  <!-- 六段弧片段(青 0/14/20% 进场,琥珀 +3% 错相;60/63% 起原路退回) -->
  <g fill="none" stroke-width="30" stroke-linecap="round">
    <g opacity="0" transform="translate(-80 -55)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.26;0.60;0.74;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-80 -55;-80 -55;0 0;0 0;-80 -55;-80 -55" keyTimes="0;0.08;0.26;0.60;0.74;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)" stroke-dasharray="33.33 66.67" stroke-dashoffset="0"/>
    </g>
    <g opacity="0" transform="translate(5 95)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.32;0.60;0.74;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="5 95;5 95;0 0;0 0;5 95;5 95" keyTimes="0;0.14;0.32;0.60;0.74;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)" stroke-dasharray="33.33 66.67" stroke-dashoffset="-33.33"/>
    </g>
    <g opacity="0" transform="translate(85 -40)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.38;0.60;0.74;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="85 -40;85 -40;0 0;0 0;85 -40;85 -40" keyTimes="0;0.20;0.38;0.60;0.74;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)" stroke-dasharray="33.33 66.67" stroke-dashoffset="-66.67"/>
    </g>
    <g opacity="0" transform="translate(75 60)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.29;0.63;0.77;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="75 60;75 60;0 0;0 0;75 60;75 60" keyTimes="0;0.11;0.29;0.63;0.77;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)" stroke-dasharray="33.33 66.67" stroke-dashoffset="0"/>
    </g>
    <g opacity="0" transform="translate(-70 -75)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.35;0.63;0.77;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-70 -75;-70 -75;0 0;0 0;-70 -75;-70 -75" keyTimes="0;0.17;0.35;0.63;0.77;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)" stroke-dasharray="33.33 66.67" stroke-dashoffset="-33.33"/>
    </g>
    <g opacity="0" transform="translate(35 95)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.41;0.63;0.77;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        values="35 95;35 95;0 0;0 0;35 95;35 95" keyTimes="0;0.23;0.41;0.63;0.77;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.3 1;0 0 1 1;0.6 0.05 0.8 0.5;0 0 1 1"
                        dur="6s" repeatCount="indefinite"/>
      <path pathLength="100" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)" stroke-dasharray="33.33 66.67" stroke-dashoffset="-66.67"/>
    </g>
  </g>

  <!-- 焊接光带:装配完成后沿双环扫一道(44%–56%),扫完即隐。
       dashoffset 0→-100 = dash 从路径起点走到完全离场;停靠一律靠组透明度隐藏,
       offset≠0 的"隐藏位"会驻留在路径可见区(dash 周期 100 会回绕)。 -->
  <g fill="none" stroke-width="30" stroke-linecap="round" filter="url(#glowTrack)">
    <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.42;0.44;0.54;0.57;1" dur="6s" repeatCount="indefinite"/>
    <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36"
          stroke="#eaffff" stroke-dasharray="12 88" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;0;-100;-100" keyTimes="0;0.44;0.56;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path pathLength="100" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36"
          stroke="#fff6dd" stroke-dasharray="12 88" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;0;-100;-100" keyTimes="0;0.44;0.56;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 交叉投影(v2,仅在装配完成期可见) -->
  <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" fill="none" stroke="#040b14" stroke-width="52" stroke-linecap="round" filter="url(#soft)" mask="url(#onCyan)">
    <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.40;0.44;0.60;0.72;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- spark:装配落定时弹出,解体时熄灭 -->
  <circle cx="256" cy="256" r="40" fill="url(#gl)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.7;0.7;0;0" keyTimes="0;0.42;0.46;0.50;0.60;0.66;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="0" fill="#f8fafc" filter="url(#glowDot)">
    <animate attributeName="r" values="0;0;15;13;13;0;0" keyTimes="0;0.42;0.46;0.50;0.58;0.64;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
