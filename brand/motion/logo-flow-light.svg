<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Everlasting 动效方案一:能量流光(浅底)">
  <title>Everlasting — 能量流光(Comet Flow) · 浅底</title>
  <desc>两枚发光彗星分别沿青/琥珀环逆时针循环流动,白色亮头领先,光晕拖尾随后;
    spark 以 2.5s 呼吸。纯 SMIL,无 JS/CSS,可直接 &lt;img&gt; 引用或内联。
    同步原理:overlay path 设 pathLength=100,dashoffset 从 L 到 L-100 线性递减,
    彗头(拖尾前缘)恰好落在弧长百分比 100f 处,与 animateMotion(paced 匀速)的亮头圆重合。</desc>
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e4ebf4"/>
    </radialGradient>
    <filter id="glowTrack" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-350%" y="-350%" width="800%" height="800%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 2026-08-28 v2 浅底版:600 级渐变 + 浅色 tile,语义与深底版完全一致(与 brand/logo-mark-light.svg 同步) -->
  <linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#06b6d4"/><stop offset="0.55" stop-color="#0891b2"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
    <stop offset="0" stop-color="#f59e0b"/><stop offset="0.55" stop-color="#d97706"/><stop offset="1" stop-color="#b45309"/>
  </linearGradient>
  <radialGradient id="gl">
    <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/><stop offset="0.45" stop-color="#0ea5e9" stop-opacity="0.12"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
  </radialGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="71" fill="none" stroke="#c9d4e4" stroke-width="3" opacity="0.45"/>

  <!-- 底层轨道(暗态) -->
  <g fill="none" stroke-width="30" stroke-linecap="round" opacity="0.28">
    <path id="loopC" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)"/>
    <path id="loopA" d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)"/>
  </g>
  <!-- 琥珀环的逆向几何(供彗头 animateMotion 用,不可见) -->
  <path id="motA" d="M 231.12 296.36 A 118 118 0 1 0 231.12 215.64" fill="none" stroke="none"/>

  <!-- 彗星拖尾(青,自然方向;琥珀,逆向;两者相差半圈) -->
  <g fill="none" stroke-width="30" stroke-linecap="round" filter="url(#glowTrack)">
    <path pathLength="100" d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36"
          stroke="url(#gc)" stroke-dasharray="18 82" stroke-dashoffset="18">
      <animate attributeName="stroke-dashoffset" values="18;-82" dur="5s" repeatCount="indefinite"/>
    </path>
    <path pathLength="100" d="M 231.12 296.36 A 118 118 0 1 0 231.12 215.64"
          stroke="url(#ga)" stroke-dasharray="18 82" stroke-dashoffset="18">
      <animate attributeName="stroke-dashoffset" values="18;-82" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 彗头亮点 -->
  <g filter="url(#glowDot)">
    <circle r="9.5" fill="#0e7490">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#loopC"/></animateMotion>
    </circle>
    <circle r="9.5" fill="#b45309">
      <animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#motA"/></animateMotion>
    </circle>
  </g>

  <circle cx="256" cy="256" r="40" fill="url(#gl)">
    <animate attributeName="r" values="40;46;40" dur="2.5s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="256" cy="256" r="13" fill="#1e293b" filter="url(#glowDot)">
    <animate attributeName="r" values="13;15;13" dur="2.5s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
