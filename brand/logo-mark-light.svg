<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Everlasting logo (light surfaces)">
  <!-- Light-surface variant — 600 级基色渐变(500→600→700),几何/效果与 logo-mark.svg v2 完全同构。
       浅底 PWA 导出(scripts/export-icons.mjs)会复用本文件 <g> 内容:defs 必须留在首个 <g> 内部。 -->
  <g>
    <defs>
      <linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
        <stop offset="0" stop-color="#06b6d4"/>
        <stop offset="0.55" stop-color="#0891b2"/>
        <stop offset="1" stop-color="#0e7490"/>
      </linearGradient>
      <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="392">
        <stop offset="0" stop-color="#f59e0b"/>
        <stop offset="0.55" stop-color="#d97706"/>
        <stop offset="1" stop-color="#b45309"/>
      </linearGradient>
      <radialGradient id="gl">
        <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
        <stop offset="0.45" stop-color="#0ea5e9" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
      <mask id="onCyan" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
        <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
      </mask>
    </defs>
    <g fill="none" stroke-width="30" stroke-linecap="round">
      <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="url(#gc)"/>
    </g>
    <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" fill="none" stroke="#0c1a2a" stroke-width="52" stroke-linecap="round" opacity="0.4" filter="url(#soft)" mask="url(#onCyan)"/>
    <g fill="none" stroke-width="30" stroke-linecap="round">
      <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="url(#ga)"/>
    </g>
    <circle cx="256" cy="256" r="40" fill="url(#gl)"/>
    <circle cx="256" cy="256" r="13" fill="#1e293b"/>
  </g>
</svg>
