<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Everlasting app icon (maskable)">
  <!-- Maskable variant — full-bleed square (launcher applies its own mask),
       mark at 50% so it stays inside the 20% corner safe zone. -->
  <rect width="512" height="512" fill="#0a0e14"/>
  <g transform="translate(128 128) scale(0.5)">
    <g fill="none" stroke-width="30" stroke-linecap="round">
      <path d="M 280.88 215.64 A 118 118 0 1 0 280.88 296.36" stroke="#22d3ee"/>
      <path d="M 231.12 215.64 A 118 118 0 1 1 231.12 296.36" stroke="#fbbf24"/>
    </g>
    <circle cx="256" cy="256" r="13" fill="#f8fafc"/>
  </g>
</svg>
